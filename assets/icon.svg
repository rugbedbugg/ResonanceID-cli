<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141d42"/>
      <stop offset="100%" stop-color="#070b1c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- faint spectrogram bars: the audio the peaks are picked from -->
  <g fill="#5eead4" opacity=".2">
    <rect x="64"  y="392" width="12" height="40"  rx="6"/>
    <rect x="94"  y="366" width="12" height="66"  rx="6"/>
    <rect x="124" y="404" width="12" height="28"  rx="6"/>
    <rect x="154" y="344" width="12" height="88"  rx="6"/>
    <rect x="184" y="382" width="12" height="50"  rx="6"/>
    <rect x="214" y="330" width="12" height="102" rx="6"/>
    <rect x="244" y="398" width="12" height="34"  rx="6"/>
    <rect x="274" y="356" width="12" height="76"  rx="6"/>
    <rect x="304" y="386" width="12" height="46"  rx="6"/>
    <rect x="334" y="340" width="12" height="92"  rx="6"/>
    <rect x="364" y="400" width="12" height="32"  rx="6"/>
    <rect x="394" y="370" width="12" height="62"  rx="6"/>
    <rect x="424" y="392" width="12" height="40"  rx="6"/>
  </g>

  <!-- anchor-to-target-zone pairs: the hashed constellation -->
  <g stroke="#38bdf8" stroke-opacity=".72" stroke-width="5" stroke-linecap="round">
    <path d="M120 300 L186 214"/>
    <path d="M120 300 L206 318"/>
    <path d="M120 300 L262 154"/>
    <path d="M262 154 L360 206"/>
    <path d="M262 154 L330 108"/>
    <path d="M206 318 L360 206"/>
    <path d="M360 206 L412 296"/>
  </g>

  <g fill="#e0f2fe">
    <circle cx="120" cy="300" r="34" fill="url(#glow)"/>
    <circle cx="262" cy="154" r="34" fill="url(#glow)"/>
    <circle cx="360" cy="206" r="30" fill="url(#glow)"/>
    <circle cx="120" cy="300" r="13"/>
    <circle cx="262" cy="154" r="13"/>
    <circle cx="186" cy="214" r="8.5"/>
    <circle cx="206" cy="318" r="8.5"/>
    <circle cx="360" cy="206" r="10"/>
    <circle cx="330" cy="108" r="7.5"/>
    <circle cx="412" cy="296" r="8.5"/>
  </g>
  <g fill="#f0abfc">
    <circle cx="186" cy="214" r="4"/>
    <circle cx="412" cy="296" r="4"/>
  </g>
</svg>
