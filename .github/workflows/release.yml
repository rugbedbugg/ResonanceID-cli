name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargo.toml version must match the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag version:  $tag"
          echo "crate version: $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: resonanceid-cli-${{ github.ref_name }}-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: resonanceid-cli-${{ github.ref_name }}-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers (Linux, for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin resonanceid-cli --target ${{ matrix.target }}

      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/resonanceid-cli.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/resonanceid-cli" "dist/${{ matrix.artifact }}"
          fi
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --verify-tag --generate-notes
