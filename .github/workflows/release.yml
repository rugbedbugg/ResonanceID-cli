name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read package version and verify release tags
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag version:   $tag"
          echo "crate version: $crate"
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $crate"
            exit 1
          fi

  validate:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.artifact }}
    needs: [verify, validate]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built with cargo-zigbuild against an old glibc (2.17,
          # RHEL 7 / Ubuntu 14.04 era) so one binary runs on essentially every
          # glibc distro still in use. libasound is still a runtime dependency.
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-gnu.2.17
            artifact: resonanceid-cli-v${{ needs.verify.outputs.version }}-linux-x86_64
            builder: zigbuild
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            artifact: resonanceid-cli-v${{ needs.verify.outputs.version }}-windows-x86_64.exe
            builder: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers (Linux, for cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: jdx/mise-action@v2
      - run: mise run setup
      - name: Install cross-compilation target
        run: mise exec -- rustup target add --toolchain stable ${{ matrix.rust_target }}

      - name: Install Zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: mise exec -- rustup run stable cargo zigbuild --release --locked --bin resonanceid-cli --target ${{ matrix.build_target }}

      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run: mise exec -- rustup run stable cargo build --release --locked --bin resonanceid-cli --target ${{ matrix.build_target }}

      - name: Smoke-test release binary
        shell: bash
        run: |
          binary="target/${{ matrix.rust_target }}/release/resonanceid-cli"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          "$binary" --help

      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.rust_target }}/release/resonanceid-cli.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.rust_target }}/release/resonanceid-cli" "dist/${{ matrix.artifact }}"
          fi
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify built artifact checksums
        working-directory: artifacts
        run: sha256sum --check *.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --verify-tag --generate-notes

      - name: Verify published artifacts against the build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
          cd downloaded
          sha256sum --check ../artifacts/*.sha256

  validate-packages:
    needs: [verify, release]
    uses: ./.github/workflows/packaging.yml
    with:
      tag: v${{ needs.verify.outputs.version }}
